<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文書目錄 - 澳門漢文文書語料庫</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .loading-tip { padding: 20px; color: #8c8880; text-align: center; font-style: italic; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="site-title">澳門漢文文書語料庫</div>
            <div class="site-subtitle">Macau Chapas Sínicas Corpus</div>
        </div>
    </header>

    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="documents.html">文書瀏覽</a></li>
                <li><a href="search.html">高級檢索</a></li>
                <li><a href="people.html">人物索引</a></li>

                <li><a href="analysis.html">數據可視化</a></li>
            </ul>
        </div>
    </nav>
    
    <main style="margin-top: 0 !important; padding-top: 0 !important;">
        <div class="container" style="margin-top: 0 !important; padding-top: 0 !important;">

            <div id="loading" class="loading-tip">正在调取語料库目录...</div>

            <div id="main-container" class="hidden" style="margin-top: 0 !important; padding-top: 10px !important;">
                
                <h1 style="margin-top: 0 !important; padding-top: 5px !important; margin-bottom: 15px !important;">文書目錄</h1>
                <p>共收錄 <strong id="total-count">0</strong> 篇文书</p>

                <div class="document-list" id="list-box"></div>

                <div class="page-nav" id="pagination-box"></div>
                
            </div>

        </div>
    </main>

    <script>
        // 1. 系统核心配置（100% 还原你 PHP 中的限制）
        const LIMIT = 20; 
        let currentPage = 1;
        let allDocuments = []; // 用于存放清洗后的全量文书数据

        // 从 URL 提取 ?page=X 参数（让用户刷新或分享网址时能保持在当前页）
        const urlParams = new URLSearchParams(window.location.search);
        let pageParam = parseInt(urlParams.get('page'));
        if (pageParam && pageParam > 0) {
            currentPage = pageParam;
        }

        // 2. 异步请求本地批量导出的 JSON 数据包
        fetch('../data/macau_archive.json')
            .then(response => {
                if (!response.ok) throw new Error("无法读取数据包");
                return response.json();
            })
            .then(rawData => {
                // 执行与详情页完全一致的【超级容错与清洗逻辑】
                let mixedArray = [];
                if (Array.isArray(rawData)) {
                    mixedArray = rawData;
                } else if (rawData && typeof rawData === 'object') {
                    mixedArray = rawData.data || Object.values(rawData);
                }
                if (!Array.isArray(mixedArray)) {
                    mixedArray = Array.from(mixedArray);
                }

                // 抽离出主文档表
                const documentsObj = mixedArray.find(item => item && item.type === 'table' && item.name === 'documents');
                
                if (documentsObj && documentsObj.data) {
                    // 严格按照 sort_order 升序排列，复刻 SQL ORDER BY sort_order
                    allDocuments = [...documentsObj.data].sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0));
                }

                if (allDocuments.length === 0) {
                    document.getElementById('loading').innerHTML = "❌ 語料庫内未发现有效的文书记录";
                    return;
                }

                // 首次渲染显示
                document.getElementById('total-count').innerText = allDocuments.length;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('main-container').classList.remove('hidden');
                
                renderListPage();
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = "❌ 目录调取失败，请检查数据文件路径。";
                console.error(err);
            });

        // 3. 核心分页渲染函数（代替原 PHP 中的 foreach 循环）
        function renderListPage() {
            const totalRows = allDocuments.length;
            const totalPages = Math.ceil(totalRows / LIMIT);

            // 边界容错
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;

            // 计算当前页的数据片段（对应 SQL 的 LIMIT :limit OFFSET :offset）
            const offset = (currentPage - 1) * LIMIT;
            const pageData = allDocuments.slice(offset, offset + LIMIT);

            // === A. 渲染文书列表条目 ===
            const listBox = document.getElementById('list-box');
            let listHtml = '';

            pageData.forEach(doc => {
                listHtml += `
                    <div class="document-item">
                        <h3>
                            <a href="document.html?id=${encodeURIComponent(doc.id)}">
                                ${escapeHtml(doc.title)}
                            </a>
                        </h3>
                        <div class="doc-meta">
                            年份：${escapeHtml(doc.year || '未知')} &nbsp;&nbsp;｜&nbsp;&nbsp; 地點：${escapeHtml(doc.location || '未知')}
                        </div>
                        <div class="doc-section">
                            ${escapeHtml(doc.chapter || '')}
                        </div>
                    </div>
                `;
            });
            listBox.innerHTML = listHtml;

            // === B. 渲染底部翻页控制（完美复刻原 PHP page-nav 逻辑） ===
            const paginationBox = document.getElementById('pagination-box');
            let navHtml = '';

            if (currentPage > 1) {
                navHtml += `<a href="javascript:void(0)" onclick="goToPage(1)">首頁</a> `;
                navHtml += `<a href="javascript:void(0)" onclick="goToPage(${currentPage - 1})">上一頁</a> `;
            }

            navHtml += `<span class="page-current">${currentPage}</span> / ${totalPages} `;

            if (currentPage < totalPages) {
                navHtml += `<a href="javascript:void(0)" onclick="goToPage(${currentPage + 1})">下一頁</a> `;
                navHtml += `<a href="javascript:void(0)" onclick="goToPage(${totalPages})">末頁</a>`;
            }

            paginationBox.innerHTML = navHtml;

            // 自动让页面滚回顶部，符合学者阅读长列表的习惯
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. 翻页跳转动作
        function goToPage(pageNumber) {
            currentPage = pageNumber;
            
            // 同步更新浏览器地址栏的 ?page=X 参数，方便用户记录当前页码，同时不刷新页面
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?page=' + currentPage;
            window.history.pushState({ path: newUrl }, '', newUrl);
            
            // 重新刷新列表数据
            renderListPage();
        }

        // 安全防御
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>

    <footer>
        <div class="container">
            澳門漢文文書語料庫 © 2026
        </div>
    </footer>

</body>
</html>
